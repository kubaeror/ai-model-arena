version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: increase

  - package-ecosystem: "npm"
    directory: "/src/dashboard-client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: increase

  # Vendored skill docs tooling (.agents/skills/...) is third-party content,
  # not part of the application; skip updates and security alerts for it.
  - package-ecosystem: "npm"
    directory: "/.agents/skills/kubernetes-skill/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # codeql init and analyze must always move together — separate PRs
      # make each one fail CI with a version-mismatch error.
      codeql-action:
        patterns:
          - "github/codeql-action*"
