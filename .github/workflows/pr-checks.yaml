name: pr-checks
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix src/dashboard-client
      - run: npm --prefix src/dashboard-client run typecheck
      - run: npm --prefix src/dashboard-client run test

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render kustomize (dev)
        run: |
          mkdir -p .tmp
          kubectl kustomize k8s/overlays/dev > .tmp/k8s-dev.yaml
      - name: Render kustomize (prod)
        run: kubectl kustomize k8s/overlays/prod > .tmp/k8s-prod.yaml
      - name: Render kustomize (observability)
        run: kubectl kustomize k8s/observability > .tmp/k8s-observability.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -verbose -summary
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            .tmp/k8s-dev.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -verbose -summary
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            .tmp/k8s-prod.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -verbose -summary
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            .tmp/k8s-observability.yaml

  k8s-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render kustomize (dev)
        run: |
          mkdir -p .tmp
          kubectl kustomize k8s/overlays/dev > .tmp/k8s-dev.yaml
      - name: Render kustomize (prod)
        run: kubectl kustomize k8s/overlays/prod > .tmp/k8s-prod.yaml
      - name: Render kustomize (observability)
        run: kubectl kustomize k8s/observability > .tmp/k8s-observability.yaml
      - name: Render kustomize (e2e)
        run: kubectl kustomize k8s/overlays/e2e > .tmp/k8s-e2e.yaml
      - uses: docker://openpolicyagent/conftest:latest
        with:
          args: test -p policy/k8s .tmp/k8s-dev.yaml
      - uses: docker://openpolicyagent/conftest:latest
        with:
          args: test -p policy/k8s .tmp/k8s-prod.yaml
      - uses: docker://openpolicyagent/conftest:latest
        with:
          args: test -p policy/k8s .tmp/k8s-observability.yaml
      - uses: docker://openpolicyagent/conftest:latest
        with:
          args: test -p policy/k8s .tmp/k8s-e2e.yaml

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker compose config
        run: docker compose config -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck scripts
        # docker:// actions do not glob-expand args; docker run on the
        # checked-out repo mirrors the local invocation exactly.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            koalaman/shellcheck:stable \
            -x scripts/backup/*.sh scripts/k8s/*.sh scripts/restore/*.sh

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker://rhysd/actionlint:latest
