name: build-deploy
on:
  push:
    branches: [main]

concurrency:
  group: main-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Start Postgres (migration parity gate)
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=arena -e POSTGRES_PASSWORD=arena -e POSTGRES_DB=arena \
            postgres:16.8-alpine
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U arena && break; sleep 1;
          done
          npm run test:db-pg
          # Free port 5432 for the compose smoke test — the PG container
          # otherwise leaks and the next step fails to bind.
          docker rm -f pg
      - run: npm ci --prefix src/dashboard-client
      - run: npm --prefix src/dashboard-client run typecheck
      - run: npm --prefix src/dashboard-client run test
      - run: npm run build
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@4a30bbadbe35d73a1729ee95a9196544192d905e # v0.17.9
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.cdx.json
          retention-days: 90
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Smoke test
        run: |
          docker compose up -d
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4000/health
          docker compose down
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign Docker image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"  # keyless signing via GitHub OIDC

  slsa:
    needs: build-and-deploy
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
      # Required by the SLSA generator's nested jobs — without it GitHub
      # rejects the whole workflow at parse time (startup_failure, 0 jobs).
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.build-and-deploy.outputs.image }}
      digest: ${{ needs.build-and-deploy.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
