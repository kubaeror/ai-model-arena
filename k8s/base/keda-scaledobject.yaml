apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: runner-openai-compat-scaler
  namespace: ai-arena
spec:
  scaleTargetRef:
    name: runner-openai-compat
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: redis-streams
      metadata:
        address: redis.ai-arena.svc:6379
        stream: arena:tasks:openai-compat
        consumerGroup: arena-runners
        pendingEntriesCount: "5"
      authenticationRef:
        name: keda-redis-auth
---
