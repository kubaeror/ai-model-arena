# Sealed Secrets — Production secret management for ai-model-arena
#
# These are SealedSecret CRD resources (bitnami.com/v1alpha1).
# The Sealed Secrets controller decrypts them into plain k8s Secrets at apply time.
#
# This file is safe to commit to git (encrypted with cluster-specific key).
#
# To rotate:
#   1. Create plain secrets with new values:
#      kubectl create secret generic arena-db-auth -n ai-arena \
#        --from-literal=DATABASE_URL=postgresql://... \
#        --dry-run=client -o yaml > plain.yaml
#   2. Seal: kubeseal < plain.yaml > sealed.yaml
#   3. Replace the matching resource below and commit.
#
# Provider API keys (OpenAI, Anthropic, Google, etc.) are NOT managed here.
# They are set via the dashboard UI and stored in a separate provider-keys Secret.

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: arena-db-auth
  namespace: ai-arena
spec:
  encryptedData:
    DASHBOARD_JWT_SECRET: 
    DATABASE_URL: 
    REDIS_PASSWORD: 
    REDIS_URL: 
  template:
    metadata:
      name: arena-db-auth
      namespace: ai-arena
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-auth
  namespace: ai-arena
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: postgres-auth
      namespace: ai-arena
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dashboard-auth
  namespace: ai-arena
# NOTE: must also contain a `metrics-token` key (consumed by the dashboard
# Deployment as METRICS_TOKEN and mirrored into observability/metrics-token
# for Prometheus scraping). Re-seal with the key before applying:
#   kubectl create secret generic dashboard-auth -n ai-arena \
#     --from-literal=password=... --from-literal=jwt-secret=... \
#     --from-literal=metrics-token=$(openssl rand -hex 32) \
#     --dry-run=client -o yaml | kubeseal --format yaml > sealed.yaml
spec:
  encryptedData:
    jwt-secret: 
    password: 
  template:
    metadata:
      name: dashboard-auth
      namespace: ai-arena
