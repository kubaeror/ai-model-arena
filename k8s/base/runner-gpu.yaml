apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-gpu-local
  namespace: ai-arena
  labels:
    app: runner
    provider: gpu-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: runner
      provider: gpu-local
  template:
    metadata:
      labels:
        app: runner
        provider: gpu-local
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/kubaeror/ai-model-arena-runner:PLACEHOLDER
          envFrom:
            - configMapRef:
                name: runner-config
            - secretRef:
                name: arena-db-auth
          env:
            - name: REDIS_CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ARENA_PROVIDER_FILTER
              value: gpu-local
            - name: OLLAMA_HOST
              value: "http://localhost:11434"
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 4000m
              memory: 8Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: outputs
              mountPath: /var/arena/outputs
            - name: tmp
              mountPath: /tmp
            - name: ollama-models
              mountPath: /var/lib/ollama
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/runner-ready"]
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/runner-ready"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/runner-ready"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: outputs
        - name: tmp
          emptyDir: {}
        - name: ollama-models
          hostPath:
            path: /var/lib/ollama
            type: DirectoryOrCreate
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
