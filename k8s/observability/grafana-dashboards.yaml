# Dashboard JSONs, provisioned by Grafana's file provider: mounted at
# /var/lib/grafana/dashboards by grafana.yaml and picked up by the
# dashboards.yaml provider below (no sidecar needed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  arena-overview.json: |
    {
      "title": "Arena Overview",
      "uid": "arena-overview",
      "panels": [
        {
          "title": "Task Rate",
          "type": "graph",
          "targets": [
            { "expr": "rate(arena_tasks_total[5m])", "legendFormat": "{{model}}" }
          ]
        },
        {
          "title": "Task Duration (p95)",
          "type": "graph",
          "targets": [
            { "expr": "histogram_quantile(0.95, rate(arena_task_duration_seconds_bucket[5m]))", "legendFormat": "{{model}}" }
          ]
        },
        {
          "title": "Queue Depth",
          "type": "graph",
          "targets": [
            { "expr": "arena_queue_depth", "legendFormat": "{{provider}}" }
          ]
        },
        {
          "title": "Error Rate",
          "type": "stat",
          "targets": [
            { "expr": "rate(arena_tasks_total{status=\"failed\"}[5m]) / rate(arena_tasks_total[5m])" }
          ]
        },
        {
          "title": "Active Tasks",
          "type": "stat",
          "targets": [
            { "expr": "arena_tasks_active" }
          ]
        }
      ]
    }
  arena-cost.json: |
    {
      "title": "Arena Cost Tracking",
      "uid": "arena-cost",
      "panels": [
        {
          "title": "Cost per Model (Daily)",
          "type": "graph",
          "targets": []
        },
        {
          "title": "Cost Trend (Total)",
          "type": "graph",
          "targets": []
        }
      ]
    }
  arena-latency.json: |
    {
      "title": "Arena Latency Analysis",
      "uid": "arena-latency",
      "panels": [
        {
          "title": "Time To First Token",
          "type": "heatmap",
          "targets": []
        },
        {
          "title": "Tool Execution Latency",
          "type": "graph",
          "targets": []
        }
      ]
    }
  arena-anomalies.json: |
    {
      "title": "Arena Anomalies",
      "uid": "arena-anomalies",
      "panels": [
        {
          "title": "Anomaly Count by Type",
          "type": "stat",
          "targets": []
        },
        {
          "title": "Recent Anomalies",
          "type": "table",
          "targets": []
        }
      ]
    }
---
# Grafana provisioning config: file provider for dashboards. Mounted at
# /etc/grafana/provisioning/dashboards by grafana.yaml; datasources are
# provisioned separately from grafana-datasources.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: arena
        orgId: 1
        folder: Arena
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
