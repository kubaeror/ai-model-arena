apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: metrics-token
              mountPath: /etc/prometheus-token
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: tmp
          emptyDir: {}
        - name: metrics-token
          secret:
            secretName: metrics-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerting-rules.yaml
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector.observability:8889']
      - job_name: arena-dashboard
        static_configs:
          - targets: ['dashboard.ai-arena:4000']
        metrics_path: /metrics
        scrape_interval: 15s
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus-token/token
      - job_name: arena-runner
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ai-arena]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: runner
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '4001'
        metrics_path: /metrics
        scrape_interval: 15s
  alerting-rules.yaml: |
    groups:
      - name: arena
        rules:
          - alert: ArenaHighErrorRate
            expr: rate(arena_tasks_total{status="failed"}[5m]) / rate(arena_tasks_total[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High task error rate (>5% over 5m)"
              runbook_url: "https://github.com/lmhub/ai-model-arena/blob/main/docs/runbooks.md#higherrorrate"
          - alert: ArenaRunnerDown
            expr: up{job="arena-runner"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Runner pod is down"
              runbook_url: "https://github.com/lmhub/ai-model-arena/blob/main/docs/runbooks.md#runnerdown"
          - alert: ArenaQueueBacklog
            expr: arena_queue_depth > 100
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Queue depth exceeds 100 for >10m"
              runbook_url: "https://github.com/lmhub/ai-model-arena/blob/main/docs/runbooks.md#queuebacklog"
          - alert: ArenaDLQGrowing
            expr: arena_dlq_depth > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Dead-letter queue has {{ $value }} entries for {{ $labels.provider }}"
              runbook_url: "https://github.com/lmhub/ai-model-arena/blob/main/docs/runbooks.md#dlqgrowing"
          - alert: ArenaScheduleFailures
            expr: increase(arena_schedule_failures_total[15m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Scheduler job {{ $labels.schedule_id }} failing"
              runbook_url: "https://github.com/lmhub/ai-model-arena/blob/main/docs/runbooks.md#schedulefailures"
          - alert: ArenaBudgetEightyPercent
            expr: arena_budget_percent > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Budget >80% consumed for {{ $labels.model }}"
              runbook_url: "https://github.com/lmhub/ai-model-arena/blob/main/docs/runbooks.md#budget"
          - alert: ArenaBudgetExhausted
            expr: arena_budget_percent >= 100
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Budget exhausted for {{ $labels.model }}"
              runbook_url: "https://github.com/lmhub/ai-model-arena/blob/main/docs/runbooks.md#budget"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
  labels:
    app: prometheus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
