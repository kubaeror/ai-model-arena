# Bearer token for Prometheus -> dashboard /metrics scraping.
#
# This is a PLACEHOLDER manifest: the real value is applied at deploy time
# (see scripts/k8s/deploy-observability.sh or apply manually):
#
#   kubectl -n observability create secret generic metrics-token \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# The value MUST match METRICS_TOKEN in the `dashboard-auth` secret
# (consumed by the dashboard Deployment in k8s/base/dashboard-deployment.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: metrics-token
  namespace: observability
type: Opaque
data:
  # base64("placeholder-token") — replace with the real value at deploy time
  token: cGxhY2Vob2xkZXItdG9rZW4=
